name: CI triage

# When a workflow below fails, Claude diagnoses it; flakes are re-run, clear safe fixes become a PR for
# Steve's review, everything else an issue assigned to Steve. Runs on ci-fix/* branches verify those PRs.
# Shared logic + plan: Collective-Shared .github/workflows/ci-triage.yml, plans/2026-11-12-ci-auto-triage.md
# Add new workflows' names here so their failures are triaged too.
on:
  workflow_run:
    workflows:
      - "Check audience (who can see a book)"
      - "Check book ids"
      - "Check Search Terms"
      - "Refresh Website Cache on Config Change"
      - "Publish App Content"
      - "Notify Audiobook Generator"
    types: [completed]

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write
  id-token: write

jobs:
  triage:
    if: github.event.workflow_run.conclusion == 'failure' || startsWith(github.event.workflow_run.head_branch, 'ci-fix/')
    uses: Noble-Collective/Collective-Shared/.github/workflows/ci-triage.yml@main
    secrets: inherit

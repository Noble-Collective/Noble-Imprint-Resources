name: Check infographic icons

# Every <Item icon="…"> needs a drawing at icons/infographic/<name>.svg, the one home of these icons: the app ships
# them in its content updates and the website draws them from there (Collective-Shared
# plans/2026-11-18-infographic-icons-one-source.md). This names a missing or unusable icon at the commit. The app's
# content publish runs the same rules and will not publish until it is fixed.
on:
  push:
    branches: [main]
    paths:
      - 'series/**.md'
      - 'icons/**'
      - '.github/scripts/check-infographic-icons*'
      - '.github/workflows/check-infographic-icons.yml'
  pull_request:
    paths:
      - 'series/**.md'
      - 'icons/**'
      - '.github/scripts/check-infographic-icons*'
      - '.github/workflows/check-infographic-icons.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Guard tests
        run: node --test .github/scripts/check-infographic-icons.test.mjs
      - name: Every infographic icon has a usable drawing
        run: node .github/scripts/check-infographic-icons.mjs

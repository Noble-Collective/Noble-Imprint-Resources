name: Refresh Website Cache on Config Change

# When a book's meta.json changes (e.g. flipping audiobook.enabled true), the
# change must reach ALL website instances together. The website bakes a content-tree
# SNAPSHOT into its Docker image (src/.content-tree-cache.json) for fast cold starts,
# so a plain deploy would ship the STALE snapshot. The correct action is to trigger
# refresh-cache.yml, which REGENERATES the snapshot from live content, commits it, and
# that commit auto-deploys a fresh image — so every instance serves the new config.
#
# Text-only edits (session .md) don't need this — notify-website.yml's runtime cache
# refresh handles those. This fires ONLY on meta.json changes (infrequent).

on:
  push:
    branches: [main]
    paths:
      - '**/meta.json'

jobs:
  trigger-cache-refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger website cache regeneration (regenerates baked snapshot → auto-deploys)
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
        run: |
          gh workflow run refresh-cache.yml \
            --repo Noble-Collective/Noble-Imprint-Resource-Website \
            --ref main
          echo "Dispatched refresh-cache: regenerates the baked content-tree snapshot from live content, commits it, and the commit auto-deploys a fresh image → new config live on all instances."

name: Content gate

# Nothing public changes until the content checks pass (Collective-Shared plans/2026-11-18-content-gate-live-branch.md).
#
# Every push to main runs the four content checks on the WHOLE tree at that commit. When they all pass, the `live`
# branch (what the public website reads) fast-forwards to it. A failed push leaves `live` where it was, and the next
# good commit moves `live` past it. Editors keep working on, and seeing, `main`.
#
# This one workflow replaces check-audience, check-book-ids, check-infographic-icons, check-search-terms and
# deploy-website-on-config (one failure notice per push at most). The check scripts stay in .github/scripts/.
#
# Until `live` exists (go-live, P3) the gate only checks: the advance step reports "no live" and does nothing, and the
# website snapshot refresh keeps the old rule (every push touching meta.json / search-terms.json / icons/).
#
# Manual run: with no sha = run the checks on main, advance nothing. With a sha + reason (repo admins only) = advance
# `live` to that sha WITHOUT running the checks — for a broken check script, never to skip a real failure.
#
# notify-app.yml (the app's publish) is separate and unchanged.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Override: advance live to this full commit sha WITHOUT the checks (admins only). Leave empty to just run the checks.'
        required: false
        default: ''
      reason:
        description: 'Why (required with a sha)'
        required: false
        default: ''

concurrency:
  # Pushes and manual runs advance in order, one at a time; PRs only check, each on its own.
  group: content-gate-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      # D8: `live` is moved by the website's GitHub App (noble-collective-content-server), the only actor the `live`
      # ruleset lets update it. Its private key is the Actions secret CONTENT_GATE_APP_KEY (set by Steve). Without the
      # secret the gate falls back to the job's own token (works only while the ruleset doesn't restrict updates).
      APP_KEY_SET: ${{ secrets.CONTENT_GATE_APP_KEY != '' }}
    steps:
      - name: Mode
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          IN_SHA: ${{ inputs.sha }}
          IN_REASON: ${{ inputs.reason }}
          ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
        run: |
          override=false
          if [ "$EVENT" = "workflow_dispatch" ] && [ -n "$IN_SHA" ]; then
            if ! [[ "$IN_SHA" =~ ^[0-9a-f]{40}$ ]]; then echo "::error::sha must be a full 40-character commit sha."; exit 1; fi
            if [ -z "${IN_REASON// /}" ]; then echo "::error::An override needs a reason."; exit 1; fi
            perm=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$ACTOR/permission" --jq .permission 2>/dev/null || echo none)
            if [ "$perm" != "admin" ]; then echo "::error::Only repo admins can override the gate ($ACTOR is '$perm')."; exit 1; fi
            echo "::warning::OVERRIDE by $ACTOR: advancing live to ${IN_SHA::7} without the checks. Reason: $IN_REASON"
            override=true
          fi
          echo "override=$override" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.mode.outputs.override == 'true' && inputs.sha || '' }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Gate tests (advance-live)
        if: steps.mode.outputs.override != 'true'
        run: node --test .github/scripts/advance-live.test.mjs

      - name: Is there a live branch yet?
        id: probe
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: node .github/scripts/advance-live.mjs probe "$GITHUB_SHA" "$BEFORE"

      # --- The four checks. Each runs even when an earlier one failed, so one push shows every problem. ---
      - name: Guard tests (audience)
        if: ${{ !cancelled() && steps.mode.outputs.override != 'true' }}
        run: node --test .github/scripts/check-audience.test.mjs
      - name: Every audience is a known value
        if: ${{ !cancelled() && steps.mode.outputs.override != 'true' }}
        run: node .github/scripts/check-audience.mjs

      - name: Guard tests (book ids)
        if: ${{ !cancelled() && steps.mode.outputs.override != 'true' }}
        run: node --test .github/scripts/check-book-ids.test.mjs
      - name: Every public book has a good, unique "id"
        if: ${{ !cancelled() && steps.mode.outputs.override != 'true' }}
        run: node .github/scripts/check-book-ids.mjs

      - name: Guard tests (infographic icons)
        if: ${{ !cancelled() && steps.mode.outputs.override != 'true' }}
        run: node --test .github/scripts/check-infographic-icons.test.mjs
      - name: Every infographic icon has a usable drawing
        if: ${{ !cancelled() && steps.mode.outputs.override != 'true' }}
        run: node .github/scripts/check-infographic-icons.mjs

      - name: Guard tests (search terms, vendored SDK spec)
        if: ${{ !cancelled() && steps.mode.outputs.override != 'true' }}
        run: node --test .github/scripts/check-search-terms.test.mjs
      - name: Check search-terms.json
        if: ${{ !cancelled() && steps.mode.outputs.override != 'true' }}
        run: node .github/scripts/check-search-terms.mjs

      # --- C2 (2026-11-22): the shared content contract (Collective-Shared ARCHITECTURE §9h, plan
      # plans/2026-11-21-content-contract.md). Errors in a PUBLIC book (or a book whose status can't be read) hold live;
      # hidden books and warnings never do. Full findings, warnings included, go to the run summary.
      - name: Guard tests (content contract, vendored)
        if: ${{ !cancelled() && steps.mode.outputs.override != 'true' }}
        run: node --test .github/scripts/content-contract.test.mjs
      - name: Content contract
        if: ${{ !cancelled() && steps.mode.outputs.override != 'true' }}
        run: |

          { echo '## Content contract'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          status=0
          node .github/scripts/content-contract.cjs --content . > "$RUNNER_TEMP/contract.txt" || status=$?
          cat "$RUNNER_TEMP/contract.txt"
          cat "$RUNNER_TEMP/contract.txt" >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $status

      # --- Advance live (only when everything above passed; never on a PR or a plain manual run). ---
      # The secret may hold the PEM itself or base64 of it (the form Secret Manager keeps, github-app-private-key).
      # The decoded key is masked line by line, never printed, and handed on through $GITHUB_ENV (a step output that
      # matches a mask would be dropped by Actions).
      - name: App key (PEM or base64 of PEM)
        if: ${{ success() && env.APP_KEY_SET == 'true' && (github.event_name == 'push' || steps.mode.outputs.override == 'true') }}
        env:
          RAW_KEY: ${{ secrets.CONTENT_GATE_APP_KEY }}
        run: |
          case "$RAW_KEY" in
            -----BEGIN*) key="$RAW_KEY" ;;
            *) key="$(printf '%s' "$RAW_KEY" | tr -d ' \r\n' | base64 -d 2>/dev/null)" || { echo "::error::CONTENT_GATE_APP_KEY is neither a PEM nor base64 of one."; exit 1; } ;;
          esac
          case "$key" in -----BEGIN*) ;; *) echo "::error::CONTENT_GATE_APP_KEY does not decode to a PEM private key."; exit 1 ;; esac
          while IFS= read -r line; do [ -n "$line" ] && echo "::add-mask::$line"; done <<< "$key"
          delim="KEY_$(openssl rand -hex 8)"
          { echo "APP_PRIVATE_KEY<<$delim"; printf '%s\n' "$key"; echo "$delim"; } >> "$GITHUB_ENV"

      - name: Token for moving live (the content server app)
        id: apptoken
        if: ${{ success() && env.APP_KEY_SET == 'true' && (github.event_name == 'push' || steps.mode.outputs.override == 'true') }}
        uses: actions/create-github-app-token@v1
        with:
          app-id: 4407594
          private-key: ${{ env.APP_PRIVATE_KEY }}

      - name: Advance live
        id: advance
        if: ${{ success() && (github.event_name == 'push' || steps.mode.outputs.override == 'true') }}
        env:
          GITHUB_TOKEN: ${{ steps.apptoken.outputs.token || github.token }}
          SHA: ${{ steps.mode.outputs.override == 'true' && inputs.sha || github.sha }}
        run: node .github/scripts/advance-live.mjs advance "$SHA"

      # --- P6: the app's content publish, only after live moved over something the app ships. ---
      # Noble-Imprint-App publish-content.yml builds the LATEST live (bursts collapse there; identical output = no-op),
      # so a commit that failed the checks is never tried. This replaces notify-app.yml's push trigger.
      - name: Publish app content
        if: ${{ success() && steps.advance.outputs.publish_app == 'true' }}
        env:
          # Fine-grained PAT: Actions read/write on Noble-Imprint-App only.
          GH_TOKEN: ${{ secrets.APP_DISPATCH_TOKEN }}
          SHA: ${{ steps.advance.outputs.live_after }}
        run: |
          for attempt in 1 2 3 4; do
            if gh workflow run publish-content.yml \
                 --repo Noble-Collective/Noble-Imprint-App \
                 --ref develop \
                 -f reason="resources live ${SHA::7}"; then
              echo "Dispatched publish-content (the app builds the latest live; identical output = no-op)."
              exit 0
            fi
            [ "$attempt" -lt 4 ] && { echo "Dispatch failed (attempt $attempt) — retrying in $((attempt * 20))s"; sleep $((attempt * 20)); }
          done
          echo "::error::Could not dispatch the app's content publish after 4 attempts."
          exit 1

      # --- Tell the website when its baked snapshot (tree, search terms, icons) needs rebuilding. ---
      # After go-live: when live moved over a meta.json / search-terms.json / icons/ change.
      # Before go-live (no live): the old deploy-website-on-config rule, whatever the checks said.
      - name: Refresh the website snapshot
        if: ${{ always() && github.event_name != 'pull_request' && (steps.advance.outputs.refresh_website == 'true' || steps.probe.outputs.refresh_website == 'true') }}
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            if gh workflow run refresh-cache.yml --repo Noble-Collective/Noble-Imprint-Resource-Website --ref main; then
              echo "Dispatched the website's refresh-cache (rebuilds the baked snapshot, commits it, auto-deploys)."
              exit 0
            fi
            [ "$attempt" -lt 3 ] && sleep $((attempt * 20))
          done
          echo "::error::Could not dispatch the website's refresh-cache after 3 attempts."
          exit 1

name: Publish App Content

# MANUAL ONLY since content gate P6 (2026-11-19; Collective-Shared plans/2026-11-18-content-gate-live-branch.md).
# The app's Content Release (Noble-Imprint-App .github/workflows/publish-content.yml) is now dispatched by
# content-gate.yml, after it moves `live` over a change the app ships (series/, bibles/, search-terms.json, icons/,
# never the Test Book: advance-live.mjs needsAppPublish). The app builds the LATEST live, gates it with its own content
# tests, and no-ops when nothing the app shows changed.
# Plan: Noble-Imprint-App plans/2026-10-03-live-content-sync.md §3.
#
# Run this by hand to re-check the hook (the app builds the latest live; identical output = no-op).

on:
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the app's content publish
        env:
          # Fine-grained PAT: Actions read/write on Noble-Imprint-App only.
          GH_TOKEN: ${{ secrets.APP_DISPATCH_TOKEN }}
        run: |
          # Retry GitHub server blips (HTTP 502 on 2026-11-13 failed two runs). A duplicate dispatch is
          # harmless: the app builds the latest main and no-ops on identical output.
          for attempt in 1 2 3 4; do
            if gh workflow run publish-content.yml \
                 --repo Noble-Collective/Noble-Imprint-App \
                 --ref develop \
                 -f reason="resources push ${GITHUB_SHA::7}"; then
              echo "Dispatched publish-content (app builds the latest main; identical output = no-op)."
              exit 0
            fi
            [ "$attempt" -lt 4 ] && { echo "Dispatch failed (attempt $attempt) — retrying in $((attempt * 20))s"; sleep $((attempt * 20)); }
          done
          echo "::error::Could not dispatch the app's content publish after 4 attempts."
          exit 1

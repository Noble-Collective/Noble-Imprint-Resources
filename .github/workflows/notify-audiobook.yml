name: Notify Audiobook Generator

on:
  push:
    branches: [main]
    paths:
      - 'series/**/sessions/*.md'
      - 'series/**/meta.json'

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.AUDIOBOOK_DISPATCH_TOKEN }}
          repository: Noble-Collective/Noble-Imprint-Audiobooks
          event-type: content-updated
